<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraud Witness — Victim Stories</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="./page.css" />
  <style>
    /* ── STORY CARD EXTRAS (dark card inside warm page) ──────────── */
    .story-card {
      cursor: pointer;
    }
    .story-card .page-card-header {
      flex-direction: column;
      gap: 10px;
    }
    .card-media {
      border-radius: var(--r-sm);
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #1c1c1c;
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    .card-media img {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .story-card:hover .card-media img { opacity: 1; }
    .card-media-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #1c1c1c;
    }
    .placeholder-icon { font-size: 2rem; opacity: 0.18; color: #fff; }
    .media-type-badge {
      display: inline-block;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      color: #8a8680;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .media-type-badge.video { color: #e87a4f; }
    .media-type-badge.audio { color: #c9a84c; }
    .story-card .page-card-title { font-size: var(--text-base); line-height: 1.4; }
    .story-card .page-card-meta  { font-size: 13px; }

    /* ── MODAL ────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.80);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: var(--r-lg);
      max-width: 720px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      position: relative;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-close {
      position: sticky; top: 1rem; float: right;
      margin: 1rem 1rem 0 0;
      background: #1c1c1c; border: 1px solid rgba(255,255,255,0.1);
      color: #8a8680; width: 32px; height: 32px; border-radius: 50%;
      font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 1; transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.12); }
    .modal-body { padding: 1.5rem 1.75rem 2rem; clear: both; color: #e8e4dc; }
    .modal-category { margin-bottom: 0.75rem; }
    .modal-title {
      font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 400;
      line-height: 1.3; margin-bottom: 0.75rem; color: #e8e4dc;
    }
    .modal-summary {
      color: #8a8680; font-size: 0.92rem; line-height: 1.6;
      margin-bottom: 1.25rem; padding-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .modal-embed {
      margin-bottom: 1.25rem;
      border-radius: var(--r-sm); overflow: hidden; background: #000;
    }
    .modal-embed iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }
    .modal-embed audio  { width: 100%; display: block; padding: 1rem; }
    .modal-meta {
      display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem;
      font-size: 0.78rem; color: #555250; margin-bottom: 1.25rem;
    }
    .modal-meta span { text-transform: uppercase; letter-spacing: 0.04em; }
    .modal-meta strong { color: #8a8680; font-weight: 500; }
    .modal-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid rgba(255,255,255,0.14);
      color: #e8e4dc; padding: 9px 18px; border-radius: var(--r-sm);
      font-size: 0.85rem; font-family: 'Source Sans 3', sans-serif;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .modal-link:hover { background: #1c1c1c; border-color: #555250; text-decoration: none; }

    /* ── STORIES GRID ─────────────────────────────────────────────── */
    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* ── CATEGORY DOTS (for modal) ───────────────────────────────── */
    .category-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
    .dot-romance_scam            { background: #e87a8a; }
    .dot-investment_fraud        { background: #e8c44f; }
    .dot-crypto_scam             { background: #7eb8f7; }
    .dot-phishing                { background: #7ee8b8; }
    .dot-tech_support_scam       { background: #b07ef7; }
    .dot-government_impersonation{ background: #e8944f; }
    .dot-identity_theft          { background: #f77e7e; }
    .dot-online_shopping_fraud   { background: #7ef7e8; }
    .dot-lottery_scam            { background: #e8e04f; }
    .dot-other                   { background: #888680; }
    .cat-romance_scam            { color: #e87a8a; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
    .cat-investment_fraud        { color: #e8c44f; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
    .cat-crypto_scam             { color: #7eb8f7; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
    .cat-phishing                { color: #7ee8b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
    .cat-tech_support_scam       { color: #b07ef7; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
    .cat-government_impersonation{ color: #e8944f; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
    .cat-identity_theft          { color: #f77e7e; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
    .cat-online_shopping_fraud   { color: #7ef7e8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
    .cat-lottery_scam            { color: #e8e04f; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
    .cat-other                   { color: #888680; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }

    @media (max-width: 640px) {
      .stories-grid { grid-template-columns: 1fr; }
      .modal-body { padding: 1rem 1.25rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-shield">✓</div>
        <span>Fraud Awareness Assistant</span>
      </div>
      <div class="top-actions">
        <a href="../index.html" class="learn-btn" style="text-decoration:none;display:flex;align-items:center;">Check a Message</a>
        <a href="./latest-trends.html" class="learn-btn" style="text-decoration:none;display:flex;align-items:center;">Latest Trends</a>
        <a href="./victim-stories.html" class="learn-btn" style="text-decoration:none;display:flex;align-items:center;">Victim Stories</a>
        <button class="theme-btn" type="button" aria-label="Toggle theme">☾</button>
      </div>
    </header>

    <main>

      <!-- HERO -->
      <div class="page-hero">
        <div class="updated-badge">🔄 Updated weekly · <span id="lastUpdated">Loading…</span></div>
        <h1>Fraud Witness</h1>
        <p>Real accounts. Real losses. Documented so others can recognise the patterns.</p>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar">
        <div class="filter-bar-inner">
          <div class="filter-select-group">
            <label for="category-select">Category</label>
            <select id="category-select">
              <option value="all">All categories</option>
              <option value="romance_scam">Romance</option>
              <option value="investment_fraud">Investment</option>
              <option value="crypto_scam">Crypto</option>
              <option value="phishing">Phishing</option>
              <option value="tech_support_scam">Tech support</option>
              <option value="government_impersonation">Government</option>
              <option value="identity_theft">Identity theft</option>
              <option value="online_shopping_fraud">Shopping</option>
              <option value="lottery_scam">Lottery</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="filter-select-group">
            <label for="sort-select">Sort by</label>
            <select id="sort-select">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="platform">By platform</option>
            </select>
          </div>
        </div>
      </div>

      <!-- GRID -->
      <div class="stories-grid" id="stories-grid">
        <div class="loading-state" id="loading-state">Loading stories…</div>
      </div>
      <div class="empty-state hidden" id="empty-state">
        <p>No stories match this filter yet.</p>
      </div>

    </main>

  </div>

  <!-- MODAL -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    const DATA_URL = "../fraud-victim-stories/data/stories.json";

    const CATEGORY_LABELS = {
      romance_scam:             "Romance scam",
      investment_fraud:         "Investment fraud",
      crypto_scam:              "Crypto scam",
      phishing:                 "Phishing",
      tech_support_scam:        "Tech support",
      government_impersonation: "Government",
      identity_theft:           "Identity theft",
      online_shopping_fraud:    "Online shopping",
      lottery_scam:             "Lottery scam",
      other:                    "Other",
    };

    const PLATFORM_LABELS = {
      youtube: "YouTube", reddit: "Reddit",
      news: "News", ftc: "FTC", podcast: "Podcast",
    };

    let allStories = [];
    let activeFilter = "all";
    let activeSort = "newest";

    // ── Theme ─────────────────────────────────────────
    const themeBtn = document.querySelector(".theme-btn");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      themeBtn.textContent = "☀";
    }
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      themeBtn.textContent = isDark ? "☀" : "☾";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    // ── Load ──────────────────────────────────────────
    async function loadStories() {
      try {
        const res = await fetch(DATA_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error();
        allStories = await res.json();
        allStories = allStories.map((s, i) => {
          const vid = extractYouTubeId(s.source_url);
          return { ...s, id: vid ? `yt-${vid}` : `story-${i}` };
        });
        renderStats();
        renderGrid();
      } catch {
        document.getElementById("loading-state").innerHTML =
          "<p style='color:var(--muted);font-size:0.9rem'>Could not load stories. Check that data/stories.json exists.</p>";
      }
    }

    // ── Stats ─────────────────────────────────────────
    function renderStats() {
      const latest = allStories.map(s => s.date_found).sort().reverse()[0];
      document.getElementById("lastUpdated").textContent = latest
        ? new Date(latest).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })
        : "recently";
    }

    // ── Sort / Filter ─────────────────────────────────
    function getVisible() {
      let list = activeFilter === "all" ? [...allStories] : allStories.filter(s => s.fraud_category === activeFilter);
      if (activeSort === "newest")   list.sort((a,b) => b.date_found.localeCompare(a.date_found));
      else if (activeSort === "oldest")   list.sort((a,b) => a.date_found.localeCompare(b.date_found));
      else if (activeSort === "platform") list.sort((a,b) => (a.source_platform||"").localeCompare(b.source_platform||""));
      return list;
    }

    // ── Render grid ───────────────────────────────────
    function renderGrid() {
      const grid = document.getElementById("stories-grid");
      const empty = document.getElementById("empty-state");
      const list = getVisible();
      const loadingEl = document.getElementById("loading-state");
      if (loadingEl) loadingEl.style.display = "none";

      if (list.length === 0) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      grid.innerHTML = list.map(s => {
        const catLabel = CATEGORY_LABELS[s.fraud_category] || "Other";
        const platform = PLATFORM_LABELS[s.source_platform] || s.source_platform || "";
        const vid = extractYouTubeId(s.source_url);
        const thumb = vid ? `https://img.youtube.com/vi/${vid}/mqdefault.jpg` : null;
        const mediaType = s.media_type || "article";

        return `
          <div class="page-card story-card" data-id="${esc(s.id)}" tabindex="0" role="button"
               aria-label="${esc(s.title)}" onclick="openModal('${esc(s.id)}')">
            <div class="card-media">
              ${thumb
                ? `<img src="${esc(thumb)}" alt="${esc(s.title)}" loading="lazy" />`
                : `<div class="card-media-placeholder"><span class="placeholder-icon">${mediaType === "video" ? "▶" : mediaType === "audio" ? "♪" : "◈"}</span></div>`
              }
            </div>
            <span class="media-type-badge ${esc(mediaType)}">${esc(mediaType)}</span>
            <span class="category-badge badge-${esc(s.fraud_category)}">${esc(catLabel)}</span>
            <h2 class="page-card-title">${esc(s.title)}</h2>
            ${s.summary ? `<p class="page-card-meta">${esc(s.summary)}</p>` : ""}
            <div class="page-card-meta" style="margin-top:auto;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;">
              <span>${esc(platform)}</span>
              <span>${s.date_found ? new Date(s.date_found).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : ""}</span>
            </div>
          </div>`;
      }).join("");
    }

    // ── Modal ─────────────────────────────────────────
    function openModal(id) {
      const s = allStories.find(s => s.id === id);
      if (!s) return;
      const catLabel  = CATEGORY_LABELS[s.fraud_category] || "Other";
      const platform  = PLATFORM_LABELS[s.source_platform] || s.source_platform || "";
      const dateStr   = s.date_found ? new Date(s.date_found).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";
      const vid = extractYouTubeId(s.source_url);
      let embedHTML = "";
      if (s.media_type === "video" && vid) {
        embedHTML = `<div class="modal-embed"><iframe id="yt-player" src="https://www.youtube.com/embed/${vid}?enablejsapi=1" allowfullscreen loading="lazy" title="${esc(s.title)}"></iframe></div>`;
      } else if (s.media_type === "audio" && s.source_url) {
        embedHTML = `<div class="modal-embed"><audio id="audio-player" controls src="${esc(s.source_url)}"></audio></div>`;
      }
      document.getElementById("modal-body").innerHTML = `
        <div class="modal-category">
          <span class="category-dot dot-${esc(s.fraud_category)}"></span>
          <span class="cat-${esc(s.fraud_category)}">${esc(catLabel)}</span>
        </div>
        <h2 class="modal-title">${esc(s.title)}</h2>
        ${s.summary ? `<p class="modal-summary">${esc(s.summary)}</p>` : ""}
        ${embedHTML}
        <div class="modal-meta">
          <span>Platform <strong>${esc(platform)}</strong></span>
          <span>Type <strong>${esc(s.media_type)}</strong></span>
          <span>Found <strong>${esc(dateStr)}</strong></span>
        </div>
        <a href="${esc(s.source_url)}" target="_blank" rel="noopener" class="modal-link">View original source ↗</a>`;
      document.getElementById("modal-overlay").classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const iframe = document.getElementById("yt-player");
      if (iframe) iframe.src = iframe.src;
      const audio = document.getElementById("audio-player");
      if (audio) { audio.pause(); audio.currentTime = 0; }
      document.getElementById("modal-overlay").classList.add("hidden");
      document.getElementById("modal-body").innerHTML = "";
      document.body.style.overflow = "";
    }

    // ── Filter dropdown ───────────────────────────────
    document.getElementById("category-select").addEventListener("change", e => {
      activeFilter = e.target.value;
      renderGrid();
    });

    document.getElementById("sort-select").addEventListener("change", e => {
      activeSort = e.target.value;
      renderGrid();
    });

    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("modal-overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("modal-overlay")) closeModal();
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

    function extractYouTubeId(url) {
      if (!url) return null;
      const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function esc(str) {
      return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    loadStories();
  </script>
</body>
</html>
