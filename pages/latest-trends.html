<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latest Scam Trends — Fraud Awareness Assistant</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="./page.css" />
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-shield">✓</div>
        <span>Fraud Awareness Assistant</span>
      </div>
      <div class="top-actions">
        <a href="../index.html" class="learn-btn" style="text-decoration:none;display:flex;align-items:center;">Check a Message</a>
        <a href="./latest-trends.html" class="learn-btn" style="text-decoration:none;display:flex;align-items:center;">Latest Trends</a>
        <a href="./victim-stories.html" class="learn-btn" style="text-decoration:none;display:flex;align-items:center;">Victim Stories</a>
        <button class="theme-btn" type="button" aria-label="Toggle theme">☾</button>
      </div>
    </header>

    <main>

      <!-- HERO -->
      <div class="page-hero">
        <div class="updated-badge">🔄 Updated weekly · <span id="lastUpdated">Loading…</span></div>
        <h1>Latest Scam Trends</h1>
        <p>Real scam examples collected from trusted sources like the FTC, AARP, and BBB — written in plain language so you know what to watch for.</p>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar">
        <div class="filter-bar-inner">
          <div class="filter-select-group">
            <label for="category-select">Category</label>
            <select id="category-select">
              <option value="all">All categories</option>
              <option value="phone_scam">Phone</option>
              <option value="text_scam">Text</option>
              <option value="email_scam">Email</option>
              <option value="social_media">Social media</option>
              <option value="romance_scam">Romance</option>
              <option value="government_impersonation">Government</option>
              <option value="tech_support">Tech support</option>
              <option value="grandparent_scam">Grandparent</option>
              <option value="investment_fraud">Investment</option>
              <option value="crypto_scam">Crypto</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="filter-select-group">
            <label for="sort-select">Sort by</label>
            <select id="sort-select">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="category">By category</option>
            </select>
          </div>
        </div>
      </div>

      <!-- GRID -->
      <div class="page-grid" id="pageGrid">
        <div class="loading-state">Loading latest scam alerts…</div>
      </div>

    </main>

  </div>

  <script>
    const DATA_URL = "../scams.json";
    let allItems = [];
    let activeCategory = "all";

    // ── Theme ─────────────────────────────────────────
    const themeBtn = document.querySelector(".theme-btn");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      themeBtn.textContent = "☀";
    }
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      themeBtn.textContent = isDark ? "☀" : "☾";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    // ── Category labels ───────────────────────────────
    const categoryLabels = {
      phone_scam: "Phone scam",
      text_scam: "Text scam",
      email_scam: "Email scam",
      social_media: "Social media",
      romance_scam: "Romance",
      government_impersonation: "Government",
      tech_support: "Tech support",
      grandparent_scam: "Grandparent",
      investment_fraud: "Investment",
      crypto_scam: "Crypto",
      phishing: "Phishing",
      identity_theft: "Identity theft",
      online_shopping_fraud: "Shopping",
      lottery_scam: "Lottery",
      other: "Other",
    };

    // ── Load data ─────────────────────────────────────
    async function loadData() {
      try {
        const res = await fetch(DATA_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error();
        allItems = await res.json();
        render();
        updateLastUpdated();
      } catch {
        document.getElementById("pageGrid").innerHTML =
          `<div class="empty-state"><p>Could not load the scam feed right now. Please check back later.<br>
          Visit <a href="https://consumer.ftc.gov/scams" target="_blank">ftc.gov/scams</a> for the latest alerts.</p></div>`;
      }
    }

    function updateLastUpdated() {
      if (allItems.length > 0 && allItems[0].updated_at) {
        const d = new Date(allItems[0].updated_at);
        document.getElementById("lastUpdated").textContent =
          d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      }
    }

    // ── Sort ──────────────────────────────────────────
    const sortSelect = document.getElementById("sort-select");
    sortSelect.addEventListener("change", render);

    function getSorted(items) {
      const val = sortSelect.value;
      const copy = [...items];
      if (val === "oldest")   return copy.sort((a,b) => new Date(a.date_reported||0) - new Date(b.date_reported||0));
      if (val === "category") return copy.sort((a,b) => (a.category||"").localeCompare(b.category||""));
      return copy.sort((a,b) => new Date(b.date_reported||0) - new Date(a.date_reported||0));
    }

    // ── Render ────────────────────────────────────────
    function render() {
      const grid = document.getElementById("pageGrid");
      const filtered = getSorted(
        activeCategory === "all" ? allItems : allItems.filter(s => s.category === activeCategory)
      );
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><p>No items found in this category yet.</p></div>`;
        return;
      }
      grid.innerHTML = filtered.map(item => `
        <div class="page-card">
          <div class="page-card-header">
            <h2 class="page-card-title">${esc(item.title)}</h2>
            <span class="category-badge badge-${item.category}">${categoryLabels[item.category] || item.category}</span>
          </div>
          <div class="page-card-meta">Reported: ${esc(item.date_reported)} · Source: ${esc(item.source)}</div>
          <div class="page-card-body">
            <div class="section-label">How it works</div>
            <p>${esc(item.how_it_works)}</p>
            ${item.example_message ? `
            <div class="section-label">Example message</div>
            <div class="example-box">${esc(item.example_message)}</div>` : ""}
            <div class="section-label">Warning signs</div>
            <ul class="red-flags-list">
              ${(item.red_flags || []).map(f => `<li>${esc(f)}</li>`).join("")}
            </ul>
            <div class="section-label">What to do</div>
            <div class="what-to-do-box">${esc(item.what_to_do)}</div>
          </div>
          <div class="page-card-footer">
            <a href="../index.html?message=${encodeURIComponent(item.example_message || item.how_it_works)}"
               class="action-btn">🔍 Test this scam</a>
          </div>
        </div>
      `).join("");
    }

    // ── Filters ───────────────────────────────────────
    document.getElementById("category-select").addEventListener("change", e => {
      activeCategory = e.target.value;
      render();
    });

    function esc(str) {
      return String(str || "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    loadData();
  </script>
</body>
</html>
