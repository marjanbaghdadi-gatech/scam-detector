<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraud Witness — Official FTC/FBI Videos</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../pages/page.css" />
  <style>
    /* ── STORY CARD EXTRAS (dark card inside warm page) ──────────── */
    .story-card { cursor: pointer; }
    .story-card .page-card-header { flex-direction: column; gap: 10px; }
    .card-media {
      border-radius: var(--r-sm);
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #1c1c1c;
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    .card-media img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.9;
      transition: opacity 0.2s;
    }
    .story-card:hover .card-media img { opacity: 1; }
    .card-media-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px;
      background: #1c1c1c;
    }
    .card-media-placeholder.ftc { background: linear-gradient(150deg, #0b1f3a 0%, #1e4a7a 100%); }
    .card-media-placeholder.fbi { background: linear-gradient(150deg, #3a0b0f 0%, #7a1e2a 100%); }
    .placeholder-icon { font-size: 2.25rem; opacity: 0.9; color: #fff; }
    .placeholder-label {
      font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: rgba(255,255,255,0.75);
    }
    .media-type-badge {
      display: inline-block;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      color: #8a8680;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .media-type-badge.video { color: #e87a4f; }
    .story-card .page-card-title { font-size: var(--text-base); line-height: 1.4; }
    .story-card .page-card-meta  { font-size: 13px; }
    .source-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .source-badge.ftc { background: #dbeafe; color: #1e40af; }
    .source-badge.fbi { background: #fde8e8; color: #9b1c1c; }

    /* ── MODAL ────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.80);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: var(--r-lg);
      max-width: 720px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      position: relative;
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-close {
      position: sticky; top: 1rem; float: right;
      margin: 1rem 1rem 0 0;
      background: #1c1c1c; border: 1px solid rgba(255,255,255,0.1);
      color: #8a8680; width: 32px; height: 32px; border-radius: 50%;
      font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 1; transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.12); }
    .modal-body { padding: 1.5rem 1.75rem 2rem; clear: both; color: #e8e4dc; }
    .modal-title {
      font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 400;
      line-height: 1.3; margin-bottom: 0.75rem; color: #e8e4dc;
    }
    .modal-summary {
      color: #8a8680; font-size: 0.92rem; line-height: 1.6;
      margin-bottom: 1.25rem; padding-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .modal-embed {
      margin-bottom: 1.25rem;
      border-radius: var(--r-sm); overflow: hidden; background: #000;
    }
    .modal-embed video { width: 100%; aspect-ratio: 16/9; display: block; border: none; background: #000; }
    .modal-meta {
      display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem;
      font-size: 0.78rem; color: #555250; margin-bottom: 1.25rem;
    }
    .modal-meta span { text-transform: uppercase; letter-spacing: 0.04em; }
    .modal-meta strong { color: #8a8680; font-weight: 500; }
    .modal-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid rgba(255,255,255,0.14);
      color: #e8e4dc; padding: 9px 18px; border-radius: var(--r-sm);
      font-size: 0.85rem; font-family: 'Source Sans 3', sans-serif;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .modal-link:hover { background: #1c1c1c; border-color: #555250; text-decoration: none; }

    /* ── STORIES GRID ─────────────────────────────────────────────── */
    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    @media (max-width: 640px) {
      .stories-grid { grid-template-columns: 1fr; }
      .modal-body { padding: 1rem 1.25rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-shield">✓</div>
        <span>Fraud Awareness Assistant</span>
      </div>
      <div class="top-actions">
        <a href="../index.html" class="learn-btn" style="text-decoration:none;display:flex;align-items:center;">Check a Message</a>
        <a href="../latest-scam-trends/latest-trends.html" class="learn-btn" style="text-decoration:none;display:flex;align-items:center;">Latest Trends</a>
        <a href="./official-videos.html" class="learn-btn" style="text-decoration:none;display:flex;align-items:center;">Victim Stories</a>
        <button class="theme-btn" type="button" aria-label="Toggle theme">☾</button>
      </div>
    </header>

    <main>

      <!-- HERO -->
      <div class="page-hero">
        <div class="updated-badge">🛡 Official sources only · <span>FTC &amp; FBI</span></div>
        <h1>Fraud Witness</h1>
        <p>Real accounts, straight from the Federal Trade Commission and the FBI — no third-party reuploads.</p>
      </div>

      <!-- GRID -->
      <div class="stories-grid" id="stories-grid"></div>

    </main>

  </div>

  <!-- MODAL -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    // Fixed set of official FTC/FBI videos. Not sourced from the n8n/YouTube
    // pipeline — that feed (fraud-victim-stories/victim-stories.html) is
    // parked for now and can be swapped back in per-experiment.
    const VIDEOS = [
      {
        id: "ftc-medicare-scams",
        title: "Fraud Affects Every Community: Medicare Scams",
        source: "ftc",
        sourceLabel: "FTC",
        source_url: "https://consumer.ftc.gov/media/video-0132-fraud-affects-every-community-medicare-scams",
        video_url: "./media/videos/ftc-medicare-scams.mp4",
        thumbnail: "./media/videos/ftc-medicare-scams.jpg",
        summary: "A retired educator recounts a call from someone claiming to be from Medicare, asking for a Social Security and bank account number to issue \"new\" Medicare cards — and the FTC attorney who helped bring the scammers to justice.",
      },
      {
        id: "ftc-family-emergency-scams",
        title: "Fraud Affects Every Community: Family Emergency Scams",
        source: "ftc",
        sourceLabel: "FTC",
        source_url: "https://consumer.ftc.gov/media/79939",
        video_url: "./media/videos/ftc-family-emergency-scams.mp4",
        thumbnail: "./media/videos/ftc-family-emergency-scams.jpg",
        summary: "A Bridgeport, CT radio host describes how scammers called family members pretending to be a nephew or grandson in trouble, pressuring them to send money right away.",
      },
      {
        id: "fbi-beware-elder-fraud",
        title: "Beware of Elder Fraud Scams",
        source: "fbi",
        sourceLabel: "FBI",
        source_url: "https://www.fbi.gov/video-repository/elder-fraud-psa-052123.mp4/view",
        video_url: "./media/videos/elder-fraud-psa-052123.mp4",
        thumbnail: "./media/videos/elder-fraud-psa-052123.png",
        summary: "An FBI public service announcement showing how quickly an elder fraud scam can separate a victim from their savings, including a grandparent-style scam scenario.",
      },
      {
        id: "fbi-webster-elder-fraud",
        title: "Former Director William Webster Offers Warning About Elder Fraud",
        source: "fbi",
        sourceLabel: "FBI",
        source_url: "https://www.fbi.gov/video-repository/webster-elder-fraud-psa-040722.mp4/view",
        video_url: "./media/videos/webster-elder-fraud-psa-040722.mp4",
        thumbnail: "./media/videos/webster-elder-fraud-psa-040722.png",
        summary: "Former FBI/CIA Director William Webster, then 98, was targeted by a lottery scam. He and his wife warn older adults and caregivers that elder fraud \"can happen to anyone.\"",
      },
      {
        id: "fbi-slc-romance-scam",
        title: "Romance Scam Victim Warns Others Not to Fall Prey to Scammers",
        source: "fbi",
        sourceLabel: "FBI",
        source_url: "https://www.fbi.gov/contact-us/field-offices/saltlakecity/news/romance-scam-victim-tells-her-story-warns-others-to-be-vigilant",
        video_url: "./media/videos/fbi-salt-lake-city-romance-scam.mp4",
        thumbnail: "./media/videos/fbi-salt-lake-city-romance-scam.png",
        summary: "An FBI Salt Lake City romance scam victim shares how she was targeted by an online suitor and lost money before coming forward to warn others to stay vigilant.",
      },
      {
        id: "fbi-identity-theft-victim-story",
        title: "Identity Theft Victim Shares Her Story",
        source: "fbi",
        sourceLabel: "FBI",
        source_url: "https://www.fbi.gov/video-repository/230712_id_theft_final.mp4/view",
        video_url: "./media/videos/fbi-identity-theft-victim-story.mp4",
        thumbnail: "./media/videos/fbi-identity-theft-victim-story.png",
        summary: "After a federally insured financial institution was defrauded through identity theft, FBI Springfield opened an investigation. The victim shares her story as a reminder to protect your personal information.",
      },
    ];

    // ── Theme ─────────────────────────────────────────
    const themeBtn = document.querySelector(".theme-btn");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      themeBtn.textContent = "☀";
    }
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      themeBtn.textContent = isDark ? "☀" : "☾";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    // ── Render grid ───────────────────────────────────
    function renderGrid() {
      const grid = document.getElementById("stories-grid");
      grid.innerHTML = VIDEOS.map(v => `
        <div class="page-card story-card" data-id="${esc(v.id)}" tabindex="0" role="button"
             aria-label="${esc(v.title)}" onclick="openModal('${esc(v.id)}')">
          <div class="card-media">
            ${v.thumbnail
              ? `<img src="${esc(v.thumbnail)}" alt="" loading="lazy" />`
              : `<div class="card-media-placeholder ${esc(v.source)}">
                   <span class="placeholder-icon">▶</span>
                   <span class="placeholder-label">${esc(v.sourceLabel)}.gov</span>
                 </div>`
            }
          </div>
          <span class="source-badge ${esc(v.source)}">${esc(v.sourceLabel)}</span>
          <span class="media-type-badge video">video</span>
          <h2 class="page-card-title">${esc(v.title)}</h2>
          <p class="page-card-meta">${esc(v.summary)}</p>
        </div>`).join("");
    }

    // ── Modal ─────────────────────────────────────────
    function openModal(id) {
      const v = VIDEOS.find(v => v.id === id);
      if (!v) return;

      let embedHTML = "";
      if (v.video_url) {
        const posterAttr = v.thumbnail ? ` poster="${esc(v.thumbnail)}"` : "";
        embedHTML = `<div class="modal-embed"><video id="fed-player" controls preload="none"${posterAttr} src="${esc(v.video_url)}"></video></div>`;
      }

      document.getElementById("modal-body").innerHTML = `
        <span class="source-badge ${esc(v.source)}" style="margin-bottom:12px;">${esc(v.sourceLabel)}</span>
        <h2 class="modal-title">${esc(v.title)}</h2>
        <p class="modal-summary">${esc(v.summary)}</p>
        ${embedHTML}
        <div class="modal-meta">
          <span>Source <strong>${esc(v.sourceLabel)}.gov</strong></span>
          <span>Type <strong>video</strong></span>
        </div>
        <a href="${esc(v.source_url)}" target="_blank" rel="noopener" class="modal-link">
          Watch on ${esc(v.sourceLabel)}.gov ↗
        </a>`;

      document.getElementById("modal-overlay").classList.remove("hidden");
      document.body.style.overflow = "hidden";

      const video = document.getElementById("fed-player");
      if (video) {
        video.addEventListener("error", () => {
          video.closest(".modal-embed").innerHTML =
            `<p style="padding:1rem;color:#8a8680;font-size:0.85rem;">Couldn't load the video inline — use the link below to watch it on ${esc(v.sourceLabel)}.gov.</p>`;
        });
      }
    }

    function closeModal() {
      const video = document.getElementById("fed-player");
      if (video) video.pause();
      document.getElementById("modal-overlay").classList.add("hidden");
      document.getElementById("modal-body").innerHTML = "";
      document.body.style.overflow = "";
    }

    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("modal-overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("modal-overlay")) closeModal();
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

    function esc(str) {
      return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    renderGrid();
  </script>
</body>
</html>
